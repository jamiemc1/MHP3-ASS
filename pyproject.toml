[project]
name = "mhp3ass"
version = "0.1.0"
description = "Armor set search for Monster Hunter Portable 3rd, ported from Athena's ASS"
authors = [{ name = "Jamie McMillan" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
mhp3ass = "mhp3ass.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.13",
    "ty>=0.0.99",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mhp3ass"]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["legacy", "harness"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-m", "not fuzz and not results"]
markers = [
    "fuzz: the full gates (500 fuzz queries in the pool, L3 with the workers in turn, the fuzz corpus's seed check; minutes); run with -m fuzz",
    "results: the full settings.cfg save/load golden check (every results golden); run with -m results",
]
